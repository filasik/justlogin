name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build release artifacts
        env:
          BSTATS_ID: ${{ secrets.BSTATS_ID }}
        run: ./gradlew build -PbstatsId=${BSTATS_ID:-35316} --no-daemon
      - name: Smoke test on Paper
        run: ./scripts/smoke-test.sh --no-build
      - name: Release notes (this version only)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" 'index($0,"## ["v"]")==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            paper/build/libs/JustLogin-*.jar
            velocity/build/libs/JustLogin-Velocity-*.jar
            bungee/build/libs/JustLogin-Bungee-*.jar
      - name: Modrinth (one version per platform)
        if: env.MODRINTH_TOKEN != ''
        run: ./gradlew :paper:modrinth :velocity:modrinth :bungee:modrinth --no-daemon
