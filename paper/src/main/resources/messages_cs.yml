  footer: "<dark_gray>└─ <gray>Tip: <white>/jl help [příkaz|strana]</white></gray> <dark_gray>·</dark_gray> <aqua><click:open_url:'https://justlogin.net'><underlined>justlogin.net</underlined></click></aqua></dark_gray>"
  page-prev: "<yellow>« Předchozí</yellow>"
  page-next: "<yellow>Další »</yellow>"
  unknown-topic: "<red>Neznámé téma nebo příkaz nápovědy: <white>{topic}</white>. Zobraz přehled pomocí <white>/jl help</white>.</red>"
  disabled:
    email: "<dark_gray>[e-mail vypnut]</dark_gray>"
    captcha: "<dark_gray>[captcha vypnuta]</dark_gray>"
    premium: "<dark_gray>[premium vypnuto]</dark_gray>"
    skins: "<dark_gray>[skiny vypnuty]</dark_gray>"
  detail:
    header: "<dark_gray>┌─ <aqua><bold>JustLogin</bold></aqua> <dark_gray>·</dark_gray> <white>{command}</white></dark_gray>"
    syntax: "<dark_gray>│</dark_gray> <gray>Syntaxe:</gray> <aqua>{syntax}</aqua>"
    aliases: "<dark_gray>│</dark_gray> <gray>Aliasy:</gray> <white>{aliases}</white>"
    permission: "<dark_gray>│</dark_gray> <gray>Oprávnění:</gray> <white>{permission}</white>"
    example: "<dark_gray>│</dark_gray> <gray>Příklad:</gray> <aqua>{example}</aqua>"
    note: "<dark_gray>│</dark_gray> <yellow>Poznámka:</yellow> <gray>{note}</gray>"
  sec:
    ACCOUNT: "<aqua><bold>Účet</bold></aqua>"
    TOTP: "<gold><bold>Dvoufázové ověření (2FA)</bold></gold>"
    PREMIUM: "<green><bold>Originální účet (Premium)</bold></green>"
    EMAIL: "<light_purple><bold>Obnova přes e-mail</bold></light_purple>"
    OTHER: "<blue><bold>Ověření a nápověda</bold></blue>"
    ADMIN: "<red><bold>Správa serveru</bold></red>"
  cmd:
    register:
      syntax: "/register <password> <confirm>"
      desc: "Zaregistruje nový účet s heslem."
      example: "/register MojeHeslo1! MojeHeslo1!"
      note: "Raději použij přihlašovací dialog místo chatu, aby heslo nezůstalo v historii."
    login:
      syntax: "/login <password>"
      desc: "Přihlásí tě k tvému zaregistrovanému účtu."
      example: "/login MojeHeslo1!"
      note: "Raději použij přihlašovací dialog místo chatu, aby heslo nezůstalo v historii."
    logout:
      syntax: "/logout"
      desc: "Odhlásí tě z aktuální relace a zruší IP session."
      example: "/logout"
      note: "Vyžaduje opětovné zadání hesla (nebo znovupřipojení u premium účtu bez hesla)."
    changepassword:
      syntax: "/changepassword <oldPassword> <newPassword>"
      desc: "Změní heslo k tvému účtu."
      example: "/changepassword Stare1! Nove2!"
      note: "Zneplatní aktivní relace. Při streamování si zakryj obrazovku."
    unregister:
      syntax: "/unregister <password>"
      desc: "Trvale odstraní tvůj zaregistrovaný účet."
      example: "/unregister MojeHeslo1!"
      note: "Nevratná akce: trvale smaže záznam tvého účtu z databáze."
    2fa_setup:
      syntax: "/2fa setup"
      desc: "Vygeneruje nový TOTP klíč a URI pro mobilní autentikátor."
      example: "/2fa setup"
      note: "Aktivaci dokonči příkazem /2fa confirm <6místný-kód> do 5 minut."
    2fa_confirm:
      syntax: "/2fa confirm <code>"
      desc: "Aktivuje 2FA pomocí 6místného kódu z aplikace."
      example: "/2fa confirm 123456"
      note: "Po potvrzení zobrazí 8 jednorázových záložních kódů — bezpečně si je ulož."
    2fa_verify:
      syntax: "/2fa verify <code>"
      desc: "Dokončí přihlášení pomocí 6místného TOTP nebo záložního kódu."
      example: "/2fa verify 123456"
      note: "Každý 30s TOTP krok i záložní kód lze použít pouze jednou."
    2fa_disable:
      syntax: "/2fa disable <code>"
      desc: "Vypne 2FA po zadání platného TOTP nebo záložního kódu."
      example: "/2fa disable 123456"
      note: "Vyžaduje platný kód z autentikátoru nebo záložní kód jako ochranu proti zneužití."
    premium:
      syntax: "/premium"
      desc: "Zapne automatické Mojang online-mode přihlášení při příštím vstupu."
      example: "/premium"
      note: "Zachová tvoje stávající serverové game_uuid i inventář; při selhání se bezpečně vrátí zpět."
    unpremium:
      syntax: "/unpremium [password]"
      desc: "Přepne účet zpět na přihlašování heslem při zachování UUID."
      example: "/unpremium"
      note: "Parametr [password] zadej jen tehdy, pokud tvůj automaticky založený premium účet ještě nemá heslo."
    email_set:
      syntax: "/email set <address> <password>"
      desc: "Zažádá o nastavení e-mailové adresy pro obnovu hesla."
      example: "/email set hrac@example.com MojeHeslo1!"
      note: "Odešle potvrzovací kód na novou adresu; aktivuj ji příkazem /email confirm <kód>."
    email_confirm:
      syntax: "/email confirm <code>"
      desc: "Potvrdí a aktivuje čekající e-mailovou adresu pro obnovu."
      example: "/email confirm AB23CD45"
      note: "Zadej jednorázový potvrzovací kód doručený do tvé e-mailové schránky."
    email_clear:
      syntax: "/email clear"
      desc: "Odebere e-mail pro obnovu hesla z tvého účtu."
      example: "/email clear"
      note: "Pro odebrání e-mailu musíš být přihlášený."
    email_recover:
      syntax: "/email recover <player> [code] [newPassword]"
      desc: "Vyžádá si e-mailem kód pro obnovu hesla nebo dokončí reset."
      example: "/email recover Steve AB23CD45 NoveHeslo2!"
      note: "Nejprve spusť bez [code] pro zaslání e-mailu, poté s <kód> <novéHeslo>."
    captcha:
      syntax: "/captcha <code>"
      desc: "Ověří captcha kód před přihlášením nebo registrací."
      example: "/captcha K7M9P"
      note: "Vyžadováno před přihlášením/registrací při aktivaci ochrany proti robotům."
    skin:
      syntax: "/skin <player|reset>"
      desc: "Změní tvůj herní skin podle Mojang účtu nebo jej vrátí na výchozí."
      example: "/skin Notch"
      note: "Projeví se okamžitě ve hře a zůstane uložen i po odpojení."
    jl_help:
      syntax: "/jl help [page|topic|command]"
      desc: "Zobrazí stránkovanou nápovědu nebo detail vybraného příkazu."
      example: "/jl help import"
      note: "Kliknutím na libovolný řádek příkazu jej vložíš do chatu."
    jl_reload:
      syntax: "/jl reload"
      desc: "Znovu načte config.yml a messages_<lang>.yml z disku."
      example: "/jl reload"
      note: "Okamžitě aplikuje změněné nastavení a překlady bez restartu serveru."
    jl_status:
      syntax: "/jl status <player>"
      desc: "Zobrazí UUID účtu, algoritmus hashe, stav premium, 2FA a relace."
      example: "/jl status Steve"
      note: "Diagnostický přehled pouze pro čtení; nikdy nevypisuje hashe hesel ani tajné klíče."
    jl_audit:
      syntax: "/jl audit [limit]"
      desc: "Vypíše poslední záznamy bezpečnostního a administrátorského auditu."
      example: "/jl audit 25"
      note: "Záznamy auditu se automaticky promazávají podle audit.retention-days."
    jl_unregister:
      syntax: "/jl unregister <player>"
      desc: "Administrátorsky odstraní zaregistrovaný účet hráče."
      example: "/jl unregister Steve"
      note: "Nevratná akce: odpojí hráče, pokud je online, a zapíše zásah do audit logu."
    jl_changepass:
      syntax: "/jl changepass <player> <newPassword>"
      desc: "Administrátorsky nastaví nové heslo k účtu hráče."
      example: "/jl changepass Steve DoplnHeslo99!"
      note: "Nespouštěj z konzole, pokud je čitelná .console_history; raději použij /jl forcepw."
    jl_forcepw:
      syntax: "/jl forcepw <player> <true|false>"
      desc: "Vynutí změnu hesla hráčem při jeho příštím přihlášení."
      example: "/jl forcepw Steve true"
      note: "Bezpečnější než ruční nastavení hesla, protože nové heslo zná pouze samotný hráč."
    jl_reset2fa:
      syntax: "/jl reset2fa <player>"
      desc: "Vymaže 2FA tajemství a záložní kódy hráče."
      example: "/jl reset2fa Steve"
      note: "Použij při ztrátě autentikátoru hráče nebo po rotaci souboru secrets.key."
    jl_setpremium:
      syntax: "/jl setpremium <player> <true|false>"
      desc: "Ručně přepne příznak automatického premium přihlášení hráče."
      example: "/jl setpremium Steve true"
      note: "Zachovává neměnné herní game_uuid účtu."
    jl_rename:
      syntax: "/jl rename <oldName> <newName>"
      desc: "Přejmenuje účet při plném zachování jeho herního game_uuid."
      example: "/jl rename StarySteve NovySteve"
      note: "Slouží k vyřešení kolize jmen po změně jména u Mojangu."
    jl_merge:
      syntax: "/jl merge <source> <target>"
      desc: "Sloučí zdrojový účet do cílového účtu při zachování cílového UUID."
      example: "/jl merge DocasnyUcet HlavniUcet"
      note: "Po přenesení metadat do cílového účtu odstraní zdrojový záznam."
    jl_gui:
      syntax: "/jl gui [page]"
      desc: "Otevře herní inventářové GUI pro správu účtů."
      example: "/jl gui 1"
      note: "Umožňuje filtrovat účty a jedním klikem přepínat vynucenou změnu hesla."
    jl_import:
      syntax: "/jl import [auto|authme|fastlogin|librelogin|loginsecurity|nlogin|openlogin|limboauth|authy]"
      desc: "Prohledá plugins/ a zmigruje účty ze starších auth pluginů."
      example: "/jl import auto"
      note: "Upřednostni /jl import auto před ručním zadáváním MySQL hesla v konzoli. Volby: --dry-run, --ssl-mode=<trust|disable|verify-ca|verify-full>, --keep-offline-uuid (FastLogin: zachová offline game_uuid)."
    jl_editor:
      syntax: "/jl editor [page]"
      desc: "Otevře end-to-end šifrovaný webový editor účtů (justlogin.net)."
      example: "/jl editor 1"
      note: "Šifrovací klíč AES-256-GCM zůstává pouze za # v odkazu a nikdy se neposílá na relay."
    jl_applyedits:
      syntax: "/jl applyedits <code|confirm>"
      desc: "Zobrazí náhled diffu a potvrdí změny z webového editoru."
      example: "/jl applyedits confirm"
      note: "Nejprve spusť /jl applyedits <kód> pro kontrolu změn a poté /jl applyedits confirm."
    jl_skin:
      syntax: "/jl skin <player> <target|reset>"
      desc: "Administrátorsky nastaví nebo resetuje uložený skin jiného hráče."
      example: "/jl skin Steve Alex"
      note: "Pokud je hráč právě online, nový skin se projeví okamžitě."
