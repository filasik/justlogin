  header: "<dark_gray>┌─ <aqua><bold>JustLogin</bold></aqua> <gray>v{version}</gray> <dark_gray>·</dark_gray> <white>Help</white> <gray>({page}/{pages})</gray></dark_gray>"
  preauth-header: "<dark_gray>┌─ <aqua><bold>JustLogin</bold></aqua> <gray>v{version}</gray> <dark_gray>·</dark_gray> <yellow>Authentication Help</yellow></dark_gray>"
  footer: "<dark_gray>└─ <gray>Tip: <white>/jl help [command|page]</white></gray> <dark_gray>·</dark_gray> <aqua><click:open_url:'https://justlogin.net'><underlined>justlogin.net</underlined></click></aqua></dark_gray>"
  page-prev: "<yellow>« Prev</yellow>"
  page-next: "<yellow>Next »</yellow>"
  unknown-topic: "<red>Unknown help topic or command: <white>{topic}</white>. Run <white>/jl help</white> for a list.</red>"
  disabled:
    email: "<dark_gray>[email disabled]</dark_gray>"
    captcha: "<dark_gray>[captcha disabled]</dark_gray>"
    premium: "<dark_gray>[premium disabled]</dark_gray>"
    skins: "<dark_gray>[skins disabled]</dark_gray>"
  detail:
    header: "<dark_gray>┌─ <aqua><bold>JustLogin</bold></aqua> <dark_gray>·</dark_gray> <white>{command}</white></dark_gray>"
    syntax: "<dark_gray>│</dark_gray> <gray>Syntax:</gray> <aqua>{syntax}</aqua>"
    aliases: "<dark_gray>│</dark_gray> <gray>Aliases:</gray> <white>{aliases}</white>"
    permission: "<dark_gray>│</dark_gray> <gray>Permission:</gray> <white>{permission}</white>"
    example: "<dark_gray>│</dark_gray> <gray>Example:</gray> <aqua>{example}</aqua>"
    note: "<dark_gray>│</dark_gray> <yellow>Note:</yellow> <gray>{note}</gray>"
  sec:
    ACCOUNT: "<aqua><bold>Account</bold></aqua>"
    TOTP: "<gold><bold>Two-Factor Authentication (2FA)</bold></gold>"
    PREMIUM: "<green><bold>Premium Auto-Login</bold></green>"
    EMAIL: "<light_purple><bold>Email Recovery</bold></light_purple>"
    OTHER: "<blue><bold>Verification & Help</bold></blue>"
    ADMIN: "<red><bold>Administration</bold></red>"
  cmd:
    register:
      syntax: "/register <password> <confirm>"
      desc: "Register a new account with a password."
      example: "/register MyS3cret! MyS3cret!"
      note: "Prefer the login dialog over chat commands to keep passwords out of chat history."
    login:
      syntax: "/login <password>"
      desc: "Log in to your registered account."
      example: "/login MyS3cret!"
      note: "Prefer the login dialog over chat commands to keep passwords out of chat history."
    logout:
      syntax: "/logout"
      desc: "Log out of your current session and invalidate IP resume."
      example: "/logout"
      note: "Requires re-entering your password (or reconnecting if using a passwordless premium account)."
    changepassword:
      syntax: "/changepassword <oldPassword> <newPassword>"
      desc: "Change your account password."
      example: "/changepassword OldPass1! NewPass2!"
      note: "Invalidates active sessions. Hide your screen if streaming."
    unregister:
      syntax: "/unregister <password>"
      desc: "Permanently delete your registered account."
      example: "/unregister MyS3cret!"
      note: "Destructive action: permanently removes your account record."
    2fa_setup:
      syntax: "/2fa setup"
      desc: "Generate a new TOTP secret and URI for your authenticator app."
      example: "/2fa setup"
      note: "Run /2fa confirm <6-digit-code> within 5 minutes to finish activation."
    2fa_confirm:
      syntax: "/2fa confirm <code>"
      desc: "Activate 2FA using a 6-digit code from your authenticator app."
      example: "/2fa confirm 123456"
      note: "Displays 8 single-use backup codes once confirmed — store them safely."
    2fa_verify:
      syntax: "/2fa verify <code>"
      desc: "Complete login with a 6-digit TOTP code or backup code."
      example: "/2fa verify 123456"
      note: "Each TOTP window and backup code can only be used once."
    2fa_disable:
      syntax: "/2fa disable <code>"
      desc: "Disable 2FA using a current TOTP or backup code."
      example: "/2fa disable 123456"
      note: "Requires a valid authenticator or backup code to prevent unauthorized removal."
    premium:
      syntax: "/premium"
      desc: "Enable automatic Mojang online-mode login on your next join."
      example: "/premium"
      note: "Preserves your existing server game_uuid and inventory; rolls back safely if verification fails."
    unpremium:
      syntax: "/unpremium [password]"
      desc: "Switch back to password login while keeping your UUID."
      example: "/unpremium"
      note: "Only supply [password] if your auto-registered premium account has no password yet."
    email_set:
      syntax: "/email set <address> <password>"
      desc: "Request binding a recovery email address to your account."
      example: "/email set you@example.com MyS3cret!"
      note: "Sends a confirmation code to the new address; activate it with /email confirm <code>."
    email_confirm:
      syntax: "/email confirm <code>"
      desc: "Confirm and activate your pending recovery email address."
      example: "/email confirm AB23CD45"
      note: "Enter the single-use confirmation code sent to your inbox."
    email_clear:
      syntax: "/email clear"
      desc: "Remove the recovery email address from your account."
      example: "/email clear"
      note: "You must be logged in to remove your recovery email."
    email_recover:
      syntax: "/email recover <player> [code] [newPassword]"
      desc: "Request a password reset code by email or complete recovery."
      example: "/email recover Steve AB23CD45 NewPass2!"
      note: "Run without [code] first to receive an email, then run with <code> <newPassword>."
    captcha:
      syntax: "/captcha <code>"
      desc: "Solve a pre-authentication captcha challenge."
      example: "/captcha K7M9P"
      note: "Required before login/register when captcha protection is triggered."
    skin:
      syntax: "/skin <player|reset>"
      desc: "Change your in-game skin to a Mojang player or reset back to default."
      example: "/skin Notch"
      note: "Updates immediately in-game and persists across relogs."
    jl_help:
      syntax: "/jl help [page|topic|command]"
      desc: "Display paginated interactive help or detailed command info."
      example: "/jl help import"
      note: "Click any command line to paste it into your chat box."
    jl_reload:
      syntax: "/jl reload"
      desc: "Reload config.yml and messages_<lang>.yml from disk."
      example: "/jl reload"
      note: "Applies updated settings and translations immediately without restarting."
    jl_status:
      syntax: "/jl status <player>"
      desc: "Inspect account UUIDs, hash algorithm, premium, 2FA, and session state."
      example: "/jl status Steve"
      note: "Read-only diagnostic view; never exposes password hashes or secrets."
    jl_audit:
      syntax: "/jl audit [limit]"
      desc: "Show recent security and administrative audit log entries."
      example: "/jl audit 25"
      note: "Audit entries are automatically pruned according to audit.retention-days."
    jl_unregister:
      syntax: "/jl unregister <player>"
      desc: "Delete a player's registered account as an administrator."
      example: "/jl unregister Steve"
      note: "Destructive action: kicks the player if online and records an audit entry."
    jl_changepass:
      syntax: "/jl changepass <player> <newPassword>"
      desc: "Force-set a new password for a player's account."
      example: "/jl changepass Steve TempPass99!"
      note: "Avoid running from console if .console_history is accessible; prefer /jl forcepw."
    jl_forcepw:
      syntax: "/jl forcepw <player> <true|false>"
      desc: "Require a player to choose a new password on their next login."
      example: "/jl forcepw Steve true"
      note: "Safer than setting a password manually because only the player knows the new password."
    jl_reset2fa:
      syntax: "/jl reset2fa <player>"
      desc: "Clear a player's 2FA secret and backup codes."
      example: "/jl reset2fa Steve"
      note: "Use when a player loses their authenticator device or after rotating secrets.key."
    jl_setpremium:
      syntax: "/jl setpremium <player> <true|false>"
      desc: "Manually override a player's premium auto-login flag."
      example: "/jl setpremium Steve true"
      note: "Preserves the account's immutable game_uuid."
    jl_rename:
      syntax: "/jl rename <oldName> <newName>"
      desc: "Rename an account while preserving its immutable game_uuid."
      example: "/jl rename OldSteve NewSteve"
      note: "Use to resolve username collisions after a Mojang name change."
    jl_merge:
      syntax: "/jl merge <source> <target>"
      desc: "Merge source account into target account while keeping target UUID."
      example: "/jl merge TempAccount MainAccount"
      note: "Deletes the source account record after transferring metadata to target."
    jl_gui:
      syntax: "/jl gui [page]"
      desc: "Open the in-game chest GUI account browser."
      example: "/jl gui 1"
      note: "Supports filtering accounts and toggling forced password resets."
    jl_import:
      syntax: "/jl import [auto|authme|fastlogin|librelogin|loginsecurity|nlogin|openlogin|limboauth|authy]"
      desc: "Scan plugins/ and migrate accounts from legacy auth plugins."
      example: "/jl import auto"
      note: "Prefer /jl import auto over manual MySQL arguments so DB passwords stay out of console history."
    jl_editor:
      syntax: "/jl editor [page]"
      desc: "Open an end-to-end encrypted web editor session (justlogin.net)."
      example: "/jl editor 1"
      note: "AES-256-GCM encryption key stays in the #fragment and is never sent to the relay."
    jl_applyedits:
      syntax: "/jl applyedits <code|confirm>"
      desc: "Preview and confirm encrypted account changes from the web editor."
      example: "/jl applyedits confirm"
      note: "Run /jl applyedits <code> to preview the diff first, then /jl applyedits confirm."
    jl_skin:
      syntax: "/jl skin <player> <target|reset>"
      desc: "Set or reset another player's saved skin as an administrator."
      example: "/jl skin Steve Alex"
      note: "Updates the player's skin immediately if they are currently online."
