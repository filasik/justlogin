  header: "<dark_gray>┌─ <aqua><bold>JustLogin</bold></aqua> <gray>v{version}</gray> <dark_gray>·</dark_gray> <white>Pomocník</white> <gray>({page}/{pages})</gray></dark_gray>"
  preauth-header: "<dark_gray>┌─ <aqua><bold>JustLogin</bold></aqua> <gray>v{version}</gray> <dark_gray>·</dark_gray> <yellow>Pomocník k prihláseniu</yellow></dark_gray>"
  footer: "<dark_gray>└─ <gray>Tip: <white>/jl help [príkaz|strana]</white></gray> <dark_gray>·</dark_gray> <aqua><click:open_url:'https://justlogin.net'><underlined>justlogin.net</underlined></click></aqua></dark_gray>"
  page-prev: "<yellow>« Predchádzajúca</yellow>"
  page-next: "<yellow>Ďalšia »</yellow>"
  unknown-topic: "<red>Neznáma téma alebo príkaz pomocníka: <white>{topic}</white>. Zobraz prehľad pomocou <white>/jl help</white>.</red>"
  disabled:
    email: "<dark_gray>[e-mail vypnutý]</dark_gray>"
    captcha: "<dark_gray>[captcha vypnutá]</dark_gray>"
    premium: "<dark_gray>[premium vypnuté]</dark_gray>"
    skins: "<dark_gray>[skiny vypnuté]</dark_gray>"
  detail:
    header: "<dark_gray>┌─ <aqua><bold>JustLogin</bold></aqua> <dark_gray>·</dark_gray> <white>{command}</white></dark_gray>"
    syntax: "<dark_gray>│</dark_gray> <gray>Syntax:</gray> <aqua>{syntax}</aqua>"
    aliases: "<dark_gray>│</dark_gray> <gray>Aliasy:</gray> <white>{aliases}</white>"
    permission: "<dark_gray>│</dark_gray> <gray>Oprávnenie:</gray> <white>{permission}</white>"
    example: "<dark_gray>│</dark_gray> <gray>Príklad:</gray> <aqua>{example}</aqua>"
    note: "<dark_gray>│</dark_gray> <yellow>Poznámka:</yellow> <gray>{note}</gray>"
  sec:
    ACCOUNT: "<aqua><bold>Účet</bold></aqua>"
    TOTP: "<gold><bold>Dvojfázové overenie (2FA)</bold></gold>"
    PREMIUM: "<green><bold>Originálny účet (Premium)</bold></green>"
    EMAIL: "<light_purple><bold>Obnova cez e-mail</bold></light_purple>"
    OTHER: "<blue><bold>Overenie a pomocník</bold></blue>"
    ADMIN: "<red><bold>Správa servera</bold></red>"
  cmd:
    register:
      syntax: "/register <password> <confirm>"
      desc: "Zaregistruje nový účet s heslom."
      example: "/register MojeHeslo1! MojeHeslo1!"
      note: "Radšej použi prihlasovací dialóg namiesto chatu, aby heslo nezostalo v histórii."
    login:
      syntax: "/login <password>"
      desc: "Prihlási ťa k tvojmu zaregistrovanému účtu."
      example: "/login MojeHeslo1!"
      note: "Radšej použi prihlasovací dialóg namiesto chatu, aby heslo nezostalo v histórii."
    logout:
      syntax: "/logout"
      desc: "Odhlási ťa z aktuálnej relácie a zruší IP session."
      example: "/logout"
      note: "Vyžaduje opätovné zadanie hesla (alebo znovupripojenie pri premium účte bez hesla)."
    changepassword:
      syntax: "/changepassword <oldPassword> <newPassword>"
      desc: "Zmení heslo k tvojmu účtu."
      example: "/changepassword Stare1! Nove2!"
      note: "Zneplatní aktívne relácie. Pri streamovaní si zakry obrazovku."
    unregister:
      syntax: "/unregister <password>"
      desc: "Natrvalo odstráni tvoj zaregistrovaný účet."
      example: "/unregister MojeHeslo1!"
      note: "Nevratná akcia: natrvalo zmaže záznam tvojho účtu z databázy."
    2fa_setup:
      syntax: "/2fa setup"
      desc: "Vygeneruje nový TOTP kľúč a URI pre mobilný autentikátor."
      example: "/2fa setup"
      note: "Aktiváciu dokonči príkazom /2fa confirm <6-miestny-kód> do 5 minút."
    2fa_cancel:
      syntax: "/2fa cancel"
      desc: "Zruší rozpracované nastavenie 2FA a skryje QR mapu."
      example: "/2fa cancel"
      note: "Nevypne už aktívnu 2FA."
    2fa_confirm:
      syntax: "/2fa confirm <code>"
      desc: "Aktivuje 2FA pomocou 6-miestneho kódu z aplikácie."
      example: "/2fa confirm 123456"
      note: "Po potvrdení zobrazí 8 jednorazových záložných kódov — bezpečne si ich ulož."
    2fa_verify:
      syntax: "/2fa verify <code>"
      desc: "Dokončí prihlásenie pomocou 6-miestneho TOTP alebo záložného kódu."
      example: "/2fa verify 123456"
      note: "Každý 30s TOTP krok aj záložný kód možno použiť iba raz."
    2fa_disable:
      syntax: "/2fa disable <code>"
      desc: "Vypne 2FA po zadaní platného TOTP alebo záložného kódu."
      example: "/2fa disable 123456"
      note: "Vyžaduje platný kód z autentikátora alebo záložný kód ako ochranu proti zneužitiu."
    premium:
      syntax: "/premium"
      desc: "Zapne automatické Mojang online-mode prihlásenie pri ďalšom vstupe."
      example: "/premium"
      note: "Zachová tvoje existujúce serverové game_uuid aj inventár; pri zlyhaní sa bezpečne vráti späť."
    unpremium:
      syntax: "/unpremium [password]"
      desc: "Prepne účet späť na prihlasovanie heslom pri zachovaní UUID."
      example: "/unpremium"
      note: "Parameter [password] zadaj iba vtedy, ak tvoj automaticky založený premium účet ešte nemá heslo."
    email_set:
      syntax: "/email set <address> <password>"
      desc: "Požiada o nastavenie e-mailovej adresy pre obnovu hesla."
      example: "/email set hrac@example.com MojeHeslo1!"
      note: "Odošle potvrdzovací kód na novú adresu; aktivuj ju príkazom /email confirm <kód>."
    email_confirm:
      syntax: "/email confirm <code>"
      desc: "Potvrdí a aktivuje čakajúcu e-mailovú adresu pre obnovu."
      example: "/email confirm AB23CD45"
      note: "Zadaj jednorazový potvrdzovací kód doručený do tvojej e-mailovej schránky."
    email_clear:
      syntax: "/email clear"
      desc: "Odoberie e-mail pre obnovu hesla z tvojho účtu."
      example: "/email clear"
      note: "Pre odobranie e-mailu musíš byť prihlásený."
    email_recover:
      syntax: "/email recover <player> [code] [newPassword]"
      desc: "Vyžiada si e-mailom kód pre obnovu hesla alebo dokončí reset."
      example: "/email recover Steve AB23CD45 NoveHeslo2!"
      note: "Najprv spusti bez [code] pre zaslanie e-mailu, potom s <kód> <novéHeslo>."
    captcha:
      syntax: "/captcha <code>"
      desc: "Overí captcha kód pred prihlásením alebo registráciou."
      example: "/captcha K7M9P"
      note: "Vyžadované pred prihlásením/registráciou pri aktivácii ochrany proti robotom."
    skin:
      syntax: "/skin <player|reset>"
      desc: "Zmení tvoj herný skin podľa Mojang účtu alebo ho vráti na predvolený."
      example: "/skin Notch"
      note: "Prejaví sa okamžite v hre a zostane uložený aj po odpojení."
    jl_help:
      syntax: "/jl help [page|topic|command]"
      desc: "Zobrazí stránkovaného pomocníka alebo detail vybraného príkazu."
      example: "/jl help import"
      note: "Kliknutím na ľubovoľný riadok príkazu ho vložíš do chatu."
    jl_reload:
      syntax: "/jl reload"
      desc: "Znova načíta config.yml a messages_<lang>.yml z disku."
      example: "/jl reload"
      note: "Okamžite aplikuje zmenené nastavenia a preklady bez reštartu servera."
    jl_status:
      syntax: "/jl status <player>"
      desc: "Zobrazí UUID účtu, algoritmus hashu, stav premium, 2FA a relácie."
      example: "/jl status Steve"
      note: "Diagnostický prehľad iba na čítanie; nikdy nevypisuje hashe hesiel ani tajné kľúče."
    jl_audit:
      syntax: "/jl audit [limit]"
      desc: "Vypíše posledné záznamy bezpečnostného a administrátorského auditu."
      example: "/jl audit 25"
      note: "Záznamy auditu sa automaticky premazávajú podľa audit.retention-days."
    jl_unregister:
      syntax: "/jl unregister <player>"
      desc: "Administrátorsky odstráni zaregistrovaný účet hráča."
      example: "/jl unregister Steve"
      note: "Nevratná akcia: odpojí hráča, ak je online, a zapíše zásah do audit logu."
    jl_changepass:
      syntax: "/jl changepass <player> <newPassword>"
      desc: "Administrátorsky nastaví nové heslo k účtu hráča."
      example: "/jl changepass Steve DoplnHeslo99!"
      note: "Nespúšťaj z konzoly, ak je čitateľná .console_history; radšej použi /jl forcepw."
    jl_forcepw:
      syntax: "/jl forcepw <player> <true|false>"
      desc: "Vynúti zmenu hesla hráčom pri jeho ďalšom prihlásení."
      example: "/jl forcepw Steve true"
      note: "Bezpečnejšie ako ručné nastavenie hesla, pretože nové heslo pozná iba samotný hráč."
    jl_reset2fa:
      syntax: "/jl reset2fa <player>"
      desc: "Vymaže 2FA tajomstvo a záložné kódy hráča."
      example: "/jl reset2fa Steve"
      note: "Použi pri strate autentikátora hráča alebo po rotácii súboru secrets.key."
    jl_setpremium:
      syntax: "/jl setpremium <player> <true|false>"
      desc: "Ručne prepne príznak automatického premium prihlásenia hráča."
      example: "/jl setpremium Steve true"
      note: "Zachováva nemenné herné game_uuid účtu."
    jl_rename:
      syntax: "/jl rename <oldName> <newName>"
      desc: "Premenuje účet pri plnom zachovaní jeho herného game_uuid."
      example: "/jl rename StarySteve NovySteve"
      note: "Slúži na vyriešenie kolízie mien po zmene mena u Mojangu."
    jl_merge:
      syntax: "/jl merge <source> <target>"
      desc: "Zlúči zdrojový účet do cieľového účtu pri zachovaní cieľového UUID."
      example: "/jl merge DocasnyUcet HlavniUcet"
      note: "Po prenesení metadát do cieľového účtu odstráni zdrojový záznam."
    jl_gui:
      syntax: "/jl gui [page]"
      desc: "Otvorí herné inventárové GUI pre správu účtov."
      example: "/jl gui 1"
      note: "Umožňuje filtrovať účty a jedným klikom prepínať vynútenú zmenu hesla."
    jl_import:
      syntax: "/jl import [auto|authme|fastlogin|librelogin|loginsecurity|nlogin|openlogin|limboauth|authy]"
      desc: "Prehľadá plugins/ a zmigruje účty zo starších auth pluginov."
      example: "/jl import auto"
      note: "Uprednostni /jl import auto pred ručným zadávaním MySQL hesla v konzole. Voľby: --dry-run, --ssl-mode=<trust|disable|verify-ca|verify-full>, --keep-offline-uuid (FastLogin: zachová offline game_uuid)."
    jl_editor:
      syntax: "/jl editor [page]"
      desc: "Otvorí end-to-end šifrovaný webový editor účtov (justlogin.net)."
      example: "/jl editor 1"
      note: "Šifrovací kľúč AES-256-GCM zostáva iba za # v odkaze a nikdy sa neposiela na relay."
    jl_applyedits:
      syntax: "/jl applyedits <code|confirm>"
      desc: "Zobrazí náhľad diffu a potvrdí zmeny z webového editora."
      example: "/jl applyedits confirm"
      note: "Najprv spusti /jl applyedits <kód> pre kontrolu zmien a potom /jl applyedits confirm."
    jl_skin:
      syntax: "/jl skin <player> <target|reset>"
      desc: "Administrátorsky nastaví alebo resetuje uložený skin iného hráča."
      example: "/jl skin Steve Alex"
      note: "Ak je hráč práve online, nový skin sa prejaví okamžite."
